name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, build y tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: barber
          POSTGRES_PASSWORD: barber
          POSTGRES_DB: barberflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barber"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://barber:barber@localhost:5432/barberflow_test
      JWT_SECRET: ci-secret
      # El runner corre en UTC, igual que Render: así los tests detectan
      # cualquier cálculo que dependa de la zona horaria del servidor.
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:check
      - run: npm run build

      - name: Tests unitarios
        run: npm test

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Las migraciones coinciden con el schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Tests de punta a punta (Postgres real)
        run: npm run test:e2e
